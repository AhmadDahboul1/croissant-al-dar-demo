<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croissant Al Dar">
<meta name="theme-color" content="#16110d">
<meta name="description" content="Order fresh baked goods for delivery from Croissant Al Dar.">

<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Croissant Al Dar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ed;--surface:#fff;--surface2:#faf7f3;--ink:#1c1714;--muted:#8a7f75;--line:#ebe3d9;
  --brand:#e3602a;--brand2:#f08a3c;--brand-d:#c24c1a;--brand-soft:#fdede3;--dark:#16110d;--ok:#22a06b;--ok-soft:#e2f5ec;--star:#f5a524;
  --shadow:0 1px 2px rgba(40,25,10,.04),0 8px 28px rgba(40,25,10,.07);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --f:Inter,system-ui,-apple-system,sans-serif;--fd:Fraunces,Georgia,serif;
}
html.dark{--bg:#0f0c0a;--surface:#1b1613;--surface2:#221c18;--ink:#f4ede6;--muted:#9c9087;--line:#2d2520;--brand-soft:#33201580;--ok-soft:#163327;--shadow:0 8px 28px rgba(0,0,0,.35)}
html[dir=rtl]{--f:Cairo,system-ui,sans-serif;--fd:Cairo,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(90px + var(--sb))}
.view{display:none}.view.on{display:block;animation:in .28s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.press{transition:transform .12s}.press:active{transform:scale(.97)}
.h-serif{font-family:var(--fd);letter-spacing:-.01em}

/* splash */
#splash{position:fixed;inset:0;background:var(--dark);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash .mk{width:96px;height:96px;border-radius:28px;background:linear-gradient(145deg,var(--brand2),var(--brand-d));display:grid;place-items:center;box-shadow:0 18px 50px rgba(227,96,42,.45);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#splash b{font-family:Fraunces,serif;color:#fff;font-size:28px}
#splash small{color:#a99b8f;letter-spacing:.2em;font-size:11px;text-transform:uppercase}

/* onboarding */
#onb{position:fixed;inset:0;background:var(--dark);color:#fff;z-index:90;display:none;flex-direction:column;padding:calc(30px + var(--st)) 26px calc(26px + var(--sb))}
#onb.on{display:flex}
#onb .art{flex:1;display:grid;place-items:center;position:relative}
#onb .art .blob{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brand2),var(--brand-d) 70%);display:grid;place-items:center;font-size:120px;box-shadow:0 30px 80px rgba(227,96,42,.35);transition:.4s}
#onb h2{font-family:var(--fd);font-size:30px;line-height:1.15;margin-bottom:10px}
#onb p{color:#b9ada3;line-height:1.55;margin-bottom:26px}
.dots{display:flex;gap:6px;margin-bottom:22px}.dots i{width:8px;height:8px;border-radius:9px;background:#3b302a;transition:.3s}.dots i.on{width:26px;background:var(--brand)}
.onb-row{display:flex;gap:10px}
.lang-sw{position:absolute;top:calc(18px + var(--st));inset-inline-end:22px;background:#2a211c;color:#fff;padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px}

/* header */
.top{padding:calc(14px + var(--st)) 20px 0;display:flex;align-items:center;gap:12px}
.loc{flex:1;min-width:0}
.loc small{color:var(--muted);font-size:12px;font-weight:500}
.loc b{display:flex;align-items:center;gap:4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:0 0 auto}
.ib .bd{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--brand);color:#fff;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);padding:0 4px}
.hello{padding:18px 20px 0}
.hello h1{font-family:var(--fd);font-size:29px;line-height:1.12}
.hello h1 em{font-style:normal;color:var(--brand)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:5px 10px;border-radius:99px;margin-top:10px}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(34,160,107,.25)}
.status.off{color:#d64545;background:#fde8e8}
.search{margin:16px 20px 0;position:relative}
.search input{width:100%;padding:15px 16px;padding-inline-start:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* promo carousel */
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 20px 4px;scrollbar-width:none}
.promos::-webkit-scrollbar,.cats::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.promo{flex:0 0 100%;scroll-snap-align:center;border-radius:24px;padding:20px;color:#fff;min-height:150px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:start}
.promo:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-end:-70px;top:-90px}
.promo small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.promo h3{font-family:var(--fd);font-size:23px;line-height:1.15;margin:6px 0 10px;max-width:62%}
.promo .cta{align-self:flex-start;background:#fff;color:var(--dark);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:99px}
.promo .em{position:absolute;inset-inline-end:10px;bottom:-6px;font-size:92px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.pdots{display:flex;justify-content:center;gap:5px;margin-top:8px}.pdots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:.3s}.pdots i.on{width:18px;background:var(--brand)}

.sec{padding:22px 20px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sh h2{font-family:var(--fd);font-size:20px}
.sh button,.sh span{color:var(--brand);font-weight:700;font-size:13px}

/* cats */
.cats{display:flex;gap:10px;overflow-x:auto;padding:10px 20px;scrollbar-width:none;position:sticky;top:0;z-index:8;background:var(--bg)}
.cats.stuck{box-shadow:0 8px 16px -12px rgba(0,0,0,.25)}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px;transition:.2s}
html[dir=rtl] .cat{padding:8px 8px 8px 14px}
.cat span{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:17px}
.cat.on{background:var(--dark);color:#fff;border-color:var(--dark)}
html.dark .cat.on{background:var(--brand);border-color:var(--brand)}
.cat.on span{background:rgba(255,255,255,.14)}

/* popular row */
.hrow{display:flex;gap:14px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}
.pc{flex:0 0 168px;background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:hidden;text-align:start;box-shadow:var(--shadow)}
.pc .img{height:118px;display:grid;place-items:center;font-size:62px;position:relative}
.pc .bx{padding:10px 12px 12px}
.pc h4{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mt{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* list */
.list{display:flex;flex-direction:column;gap:12px}
.cat-title{font-family:var(--fd);font-size:18px;margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.it{display:flex;gap:14px;background:var(--surface);border-radius:20px;padding:12px;border:1px solid var(--line);text-align:start;width:100%;align-items:stretch}
.thumb{width:96px;height:96px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden}
.thumb:after,.pc .img:after,.hero-img:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 55%)}
.it .m{flex:1;min-width:0;display:flex;flex-direction:column}
.it h4{font-size:15.5px;font-weight:700;line-height:1.25}
.it p{color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:5px}
.meta b{color:var(--star)}
.it .bt{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:16px}
.price s{color:var(--muted);font-weight:500;font-size:12px;margin-inline-start:4px}
.add{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(227,96,42,.35)}
.inq{display:flex;align-items:center;gap:8px;background:var(--brand-soft);border-radius:12px;padding:3px;color:var(--brand-d);font-weight:800}
html.dark .inq{color:var(--brand2)}
.inq button{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800}
.badge{position:absolute;top:8px;inset-inline-start:8px;font-size:10px;font-weight:800;padding:4px 7px;border-radius:7px;background:var(--dark);color:#fff;text-transform:uppercase;letter-spacing:.04em;z-index:1}
.badge.new{background:var(--ok)}.badge.hot{background:var(--brand)}
.veg{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ok);border-radius:3px;position:relative;vertical-align:-2px;margin-inline-start:4px}
.veg:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:56px 24px}
.empty .ic{width:96px;height:96px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:44px;margin:0 auto 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:var(--fd)}
.empty p{margin-bottom:22px;line-height:1.5}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--surface2) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px;height:120px}
@keyframes sk{to{background-position:-200% 0}}

/* page head */
.ph{padding:calc(14px + var(--st)) 20px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:9}
.ph h1{font-family:var(--fd);font-size:25px;flex:1}
html[dir=rtl] .flip{transform:scaleX(-1)}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fld{margin-bottom:12px}.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);outline:none;font-size:15px;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--brand);background:var(--surface)}
.fld .er{color:#d64545;font-size:12px;margin-top:5px;display:none;font-weight:600}
.fld.bad input,.fld.bad select{border-color:#d64545}.fld.bad .er{display:block}
.seg{display:flex;gap:10px}
.sg{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);text-align:start}
.sg.on{border-color:var(--brand);background:var(--brand-soft)}
.sg b{display:block;font-size:14px}.sg small{color:var(--muted);font-size:12px}
.btn{width:100%;padding:17px;border-radius:18px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(227,96,42,.3);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.dk{background:var(--dark);box-shadow:none}
html.dark .btn.dk{background:var(--surface2);border:1px solid var(--line)}
.btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none}
.btn .sp{margin-inline-start:auto;background:rgba(0,0,0,.15);padding:4px 10px;border-radius:10px;font-size:14px}

/* cart lines */
.cl{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.cl .thumb{width:66px;height:66px;font-size:34px;border-radius:14px}
.cl .m{flex:1;min-width:0}
.cl h4{font-size:14.5px;font-weight:700}
.cl small{color:var(--muted);font-size:12px;display:block;margin-top:2px;line-height:1.35}
.qty{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:4px;border:1px solid var(--line)}
.qty button{width:30px;height:30px;border-radius:9px;background:var(--surface);font-weight:800;font-size:16px}
.qty span{min-width:18px;text-align:center;font-weight:800}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);font-weight:500}
.sum .r.dc{color:var(--ok);font-weight:700}
.sum .r.t{color:var(--ink);font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:8px;padding-top:14px}
.promo-in{display:flex;gap:8px}
.promo-in input{flex:1;padding:13px 14px;border-radius:14px;border:1px dashed var(--line);background:var(--surface2);outline:none;text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.promo-in button{padding:0 18px;border-radius:14px;background:var(--dark);color:#fff;font-weight:800}
html.dark .promo-in button{background:var(--brand)}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600}
.progress .b{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.progress .b i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px;transition:width .4s}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,8,6,.55);opacity:0;pointer-events:none;transition:.3s;z-index:50;backdrop-filter:blur(2px)}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;background:var(--bg);border-radius:28px 28px 0 0;z-index:51;transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:94vh;overflow-y:auto;padding-bottom:calc(110px + var(--sb))}
.sheet.on{transform:translate(-50%,0)}
.hero-img{height:250px;display:grid;place-items:center;font-size:140px;position:relative;overflow:hidden}
.hero-img .grab{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.75);z-index:2}
.fab{position:absolute;top:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:#1c1714;display:grid;place-items:center;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.fab.x{inset-inline-end:16px}.fab.h{inset-inline-start:16px}
.sbody{padding:20px 20px 0;margin-top:-22px;background:var(--bg);border-radius:24px 24px 0 0;position:relative}
.sbody h2{font-family:var(--fd);font-size:25px;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sbody .ds{color:var(--muted);line-height:1.55;margin-bottom:6px}
.og{margin-top:18px}
.ol{font-weight:800;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ol span{font-weight:700;font-size:11px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ol span.rq{background:var(--brand-soft);border-color:transparent;color:var(--brand-d)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:start;font-weight:600}
.ch.on{border-color:var(--brand);background:var(--brand-soft)}
.ch .l{display:flex;align-items:center;gap:10px}
.ch .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.ch.on .d{border-color:var(--brand);background:var(--brand)}
.ch.on .d:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.ch.sq .d{border-radius:7px}
.ch.sq.on .d:after{width:10px;height:5px;border-radius:0;background:none;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ch small{color:var(--muted);font-weight:700}
.sfoot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;gap:12px;align-items:center;padding:14px 20px calc(14px + var(--sb));background:var(--surface);border-top:1px solid var(--line);z-index:52;transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sfoot.hide{transform:translate(-50%,120%)}
.qty.lg{padding:5px}.qty.lg button{width:38px;height:38px;font-size:18px}.qty.lg span{min-width:24px;font-size:17px}

/* floating cart */
.fcart{position:fixed;left:50%;transform:translateX(-50%) translateY(160%);bottom:calc(86px + var(--sb));width:calc(100% - 32px);max-width:448px;background:var(--dark);color:#fff;border-radius:20px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px;z-index:25;box-shadow:0 14px 34px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
html.dark .fcart{background:var(--brand)}
.fcart.on{transform:translateX(-50%) translateY(0)}
.fcart .n{background:var(--brand);border-radius:13px;min-width:40px;height:40px;display:grid;place-items:center;font-weight:800}
html.dark .fcart .n{background:rgba(0,0,0,.2)}
.fcart .t{flex:1;font-weight:700;text-align:start}
.fcart .t small{display:block;color:#bdb0a5;font-weight:500;font-size:12px}
html.dark .fcart .t small{color:#ffe1cf}
.fcart b{font-size:16px;padding-inline-end:6px}
.fcart.bump{animation:bump .35s}
@keyframes bump{40%{transform:translateX(-50%) scale(1.04)}}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + var(--sb));z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tab svg{transition:transform .2s}
.tab.on{color:var(--brand)}.tab.on svg{transform:translateY(-1px)}
.tab.on:before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
